# Build block assets; Node 24 uploads dist. Node 26 is non-blocking.

name: Blocks Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
    outputs:
      artifact_name:
        description: Name of the uploaded dist artifact
        value: dist

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    continue-on-error: ${{ matrix.node-version == 26 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist
        run: |
          set -euo pipefail
          missing=0
          for f in dist/style-blocks.css dist/blocks.build.js dist/blocks.css; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required build output '$f' is missing."
              missing=1
            else
              echo "OK: $f ($(wc -c < "$f") bytes)"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more required dist files are missing. See above."
            exit 1
          fi

      - name: Upload dist
        if: ${{ matrix.node-version == 24 }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error
